<text x="1220.0" y="558.5" text-anchor="middle" class="bt">Forecast &amp; cover per SKU</text>
<text x="1220.0" y="578.5" text-anchor="middle" class="bb">12-week baseline, festival</text>
<text x="1220.0" y="595.5" text-anchor="middle" class="bb">uplift on future weeks only,</text>
<text x="1220.0" y="612.5" text-anchor="middle" class="bb">order-up-to quantity</text>
<rect x="1378" y="518.0" width="244" height="124" rx="10" fill="#ffe3ef" stroke="#d6336c" stroke-width="2"/>
<text x="1500.0" y="540.0" text-anchor="middle" class="bt">Flags exceptions (rules,</text>
<text x="1500.0" y="560.0" text-anchor="middle" class="bt">no LLM)</text>
<text x="1500.0" y="580.0" text-anchor="middle" class="bb">Stockout, overstock, high</text>
<text x="1500.0" y="597.0" text-anchor="middle" class="bb">demand, borderline,</text>
<text x="1500.0" y="614.0" text-anchor="middle" class="bb">uplift-sensitive, volatile →</text>
<text x="1500.0" y="631.0" text-anchor="middle" class="bb">Pass / Review / Blocked</text>
