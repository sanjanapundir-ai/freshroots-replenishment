<text x="380.0" y="390.5" text-anchor="middle" class="bt">Every Monday &amp; Thursday</text>
<text x="380.0" y="410.5" text-anchor="middle" class="bb">IT team exports SKU master,</text>
<text x="380.0" y="427.5" text-anchor="middle" class="bb">stock snapshot and weekly</text>
<text x="380.0" y="444.5" text-anchor="middle" class="bb">sales from SAP</text>
<rect x="538" y="182.0" width="244" height="124" rx="10" fill="#e3efff" stroke="#2f6fd6" stroke-width="2"/>
<text x="660.0" y="231.0" text-anchor="middle" class="bt">Uploads the 3 SAP CSVs</text>
<text x="660.0" y="251.0" text-anchor="middle" class="bb">on the New run page (no manual</text>
<text x="660.0" y="268.0" text-anchor="middle" class="bb">Excel work)</text>
<rect x="818" y="518.0" width="244" height="124" rx="10" fill="#e2f6e7" stroke="#2f9e44" stroke-width="2"/>
<text x="940.0" y="540.0" text-anchor="middle" class="bt">Data checks + signed-off</text>
<text x="940.0" y="560.0" text-anchor="middle" class="bt">rules</text>
<text x="940.0" y="580.0" text-anchor="middle" class="bb">Stale or negative data stops</text>
<text x="940.0" y="597.0" text-anchor="middle" class="bb">the run. Min/max cover,</text>
<text x="940.0" y="614.0" text-anchor="middle" class="bb">festival months, lead times</text>
<text x="940.0" y="631.0" text-anchor="middle" class="bb">from config</text>
