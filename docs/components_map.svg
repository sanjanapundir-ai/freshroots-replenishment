<text x="1780.0" y="726.5" text-anchor="middle" class="bt">Monthly review</text>
<text x="1780.0" y="746.5" text-anchor="middle" class="bb">Forecast error (WAPE), bias,</text>
<text x="1780.0" y="763.5" text-anchor="middle" class="bb">and whether overrides beat the</text>
<text x="1780.0" y="780.5" text-anchor="middle" class="bb">system (FVA)</text>
