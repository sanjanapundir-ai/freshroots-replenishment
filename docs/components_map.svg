<text x="1500.0" y="735.0" text-anchor="middle" class="bt">Saves every run</text>
<text x="1500.0" y="755.0" text-anchor="middle" class="bb">Recommendations + append-only</text>
<text x="1500.0" y="772.0" text-anchor="middle" class="bb">decision log with reason codes</text>
