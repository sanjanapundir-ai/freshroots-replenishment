<text x="533" y="64" class="tt">केस 1 · Freshroots डिमांड प्लानिंग — कंपोनेंट्स मैप</text>
<rect x="240" y="160" width="1680" height="168" fill="#eaf2ff"/>
<rect x="240" y="328" width="1680" height="168" fill="#f1edff"/>
<rect x="240" y="496" width="1680" height="168" fill="#fff8e1"/>
<rect x="240" y="664" width="1680" height="168" fill="#eaf7ee"/>
