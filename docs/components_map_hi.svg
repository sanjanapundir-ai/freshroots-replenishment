<line x1="240" y1="496" x2="1920" y2="496" stroke="#ffffff" stroke-width="2"/>
<line x1="240" y1="664" x2="1920" y2="664" stroke="#ffffff" stroke-width="2"/>
<line x1="240" y1="832" x2="1920" y2="832" stroke="#ffffff" stroke-width="2"/>
<rect x="20" y="96" width="1900" height="64" rx="8" fill="#14233c"/>
<text x="130.0" y="136" text-anchor="middle" class="hd">भूमिका</text>
<text x="380.0" y="136" text-anchor="middle" class="hd">ट्रिगर</text>
<text x="660.0" y="136" text-anchor="middle" class="hd">इनपुट</text>
<text x="940.0" y="136" text-anchor="middle" class="hd">संदर्भ</text>
<text x="1220.0" y="136" text-anchor="middle" class="hd">प्रोसेसिंग</text>
<text x="1500.0" y="136" text-anchor="middle" class="hd">AI / नियम</text>
<text x="1780.0" y="136" text-anchor="middle" class="hd">आउटपुट</text>
<rect x="20" y="160" width="220" height="840" fill="#14233c"/>
<text x="130.0" y="240.0" text-anchor="middle" class="an">राघव</text>
<text x="130.0" y="264.0" text-anchor="middle" class="as">(डिमांड प्लानर)</text>
<text x="130.0" y="408.0" text-anchor="middle" class="an">SAP ERP</text>
<text x="130.0" y="432.0" text-anchor="middle" class="as">(IT टीम एक्सपोर्ट)</text>
<line x1="20" y1="328" x2="240" y2="328" stroke="#2a3d5e" stroke-width="2"/>
<text x="130.0" y="576.0" text-anchor="middle" class="an">सिस्टम</text>
<text x="130.0" y="600.0" text-anchor="middle" class="as">(Vercel पर इंजन)</text>
<line x1="20" y1="496" x2="240" y2="496" stroke="#2a3d5e" stroke-width="2"/>
<text x="130.0" y="744.0" text-anchor="middle" class="an">डेटाबेस</text>
<text x="130.0" y="768.0" text-anchor="middle" class="as">(Neon Postgres)</text>
<line x1="20" y1="664" x2="240" y2="664" stroke="#2a3d5e" stroke-width="2"/>
<text x="130.0" y="912.0" text-anchor="middle" class="an">Zoho इन्वेंटरी</text>
<text x="130.0" y="936.0" text-anchor="middle" class="as">(खरीद टीम)</text>
<line x1="20" y1="832" x2="240" y2="832" stroke="#2a3d5e" stroke-width="2"/>
<rect x="258" y="350.0" width="244" height="124" rx="10" fill="#e9e5ff" stroke="#5b4bdb" stroke-width="2"/>
<text x="380.0" y="390.5" text-anchor="middle" class="bt">हर सोमवार और गुरुवार</text>
<text x="380.0" y="410.5" text-anchor="middle" class="bb">IT टीम SAP से SKU मास्टर,</text>
<text x="380.0" y="427.5" text-anchor="middle" class="bb">स्टॉक स्नैपशॉट और साप्ताहिक</text>
<text x="380.0" y="444.5" text-anchor="middle" class="bb">बिक्री एक्सपोर्ट करती है</text>
<rect x="538" y="182.0" width="244" height="124" rx="10" fill="#e3efff" stroke="#2f6fd6" stroke-width="2"/>
<text x="660.0" y="221.0" text-anchor="middle" class="bt">3 SAP CSV फ़ाइलें अपलोड</text>
<text x="660.0" y="241.0" text-anchor="middle" class="bt">करते हैं</text>
<text x="660.0" y="261.0" text-anchor="middle" class="bb">New run पेज पर (Excel में हाथ</text>
<text x="660.0" y="278.0" text-anchor="middle" class="bb">से कोई काम नहीं)</text>
<rect x="818" y="518.0" width="244" height="124" rx="10" fill="#e2f6e7" stroke="#2f9e44" stroke-width="2"/>
<text x="940.0" y="550.0" text-anchor="middle" class="bt">डेटा जाँच + स्वीकृत नियम</text>
<text x="940.0" y="570.0" text-anchor="middle" class="bb">पुराना या नेगेटिव डेटा हो तो</text>
<text x="940.0" y="587.0" text-anchor="middle" class="bb">रन रुक जाता है। न्यूनतम/अधिकतम</text>
<text x="940.0" y="604.0" text-anchor="middle" class="bb">कवर, त्योहार के महीने, लीड</text>
<text x="940.0" y="621.0" text-anchor="middle" class="bb">टाइम config से</text>
<rect x="1098" y="518.0" width="244" height="124" rx="10" fill="#fff1cc" stroke="#e8a400" stroke-width="2"/>
<text x="1220.0" y="548.5" text-anchor="middle" class="bt">हर SKU का पूर्वानुमान और</text>
<text x="1220.0" y="568.5" text-anchor="middle" class="bt">कवर</text>
<text x="1220.0" y="588.5" text-anchor="middle" class="bb">12 हफ़्ते का बेसलाइन, त्योहार</text>
<text x="1220.0" y="605.5" text-anchor="middle" class="bb">की बढ़त सिर्फ़ आगे के हफ़्तों</text>
<text x="1220.0" y="622.5" text-anchor="middle" class="bb">पर, ऑर्डर-अप-टू मात्रा</text>
<rect x="1378" y="518.0" width="244" height="124" rx="10" fill="#ffe3ef" stroke="#d6336c" stroke-width="2"/>
<text x="1500.0" y="540.0" text-anchor="middle" class="bt">अपवाद चिह्नित करता है</text>
<text x="1500.0" y="560.0" text-anchor="middle" class="bt">(नियम, LLM नहीं)</text>
<text x="1500.0" y="580.0" text-anchor="middle" class="bb">स्टॉकआउट, ओवरस्टॉक, ज़्यादा</text>
<text x="1500.0" y="597.0" text-anchor="middle" class="bb">मांग, सीमा के पास, uplift पर</text>
<text x="1500.0" y="614.0" text-anchor="middle" class="bb">निर्भर, अस्थिर → Pass / Review</text>
<text x="1500.0" y="631.0" text-anchor="middle" class="bb">/ Blocked</text>
<rect x="1378" y="686.0" width="244" height="124" rx="10" fill="#dff5f2" stroke="#0c8f80" stroke-width="2"/>
<text x="1500.0" y="735.0" text-anchor="middle" class="bt">हर रन सेव करता है</text>
<text x="1500.0" y="755.0" text-anchor="middle" class="bb">सुझाव + कभी न बदलने वाला</text>
<text x="1500.0" y="772.0" text-anchor="middle" class="bb">निर्णय लॉग, कारण कोड के साथ</text>
<rect x="1658" y="182.0" width="244" height="124" rx="10" fill="#ffe8d9" stroke="#e8590c" stroke-width="2"/>
<text x="1780.0" y="212.5" text-anchor="middle" class="bt">रिव्यू कतार: सिर्फ़</text>
<text x="1780.0" y="232.5" text-anchor="middle" class="bt">चिह्नित SKU</text>
<text x="1780.0" y="252.5" text-anchor="middle" class="bb">इस रन में 15 में से 8। कारण</text>
<text x="1780.0" y="269.5" text-anchor="middle" class="bb">कोड के साथ मंज़ूर करें या</text>
<text x="1780.0" y="286.5" text-anchor="middle" class="bb">बदलें</text>
<rect x="1658" y="686.0" width="244" height="124" rx="10" fill="#dff5f2" stroke="#0c8f80" stroke-width="2"/>
<text x="1780.0" y="726.5" text-anchor="middle" class="bt">मासिक समीक्षा</text>
<text x="1780.0" y="746.5" text-anchor="middle" class="bb">पूर्वानुमान त्रुटि (WAPE),</text>
<text x="1780.0" y="763.5" text-anchor="middle" class="bb">झुकाव (bias), और क्या बदलाव</text>
<text x="1780.0" y="780.5" text-anchor="middle" class="bb">सिस्टम से बेहतर रहे (FVA)</text>
<rect x="1658" y="854.0" width="244" height="124" rx="10" fill="#e3efff" stroke="#2f6fd6" stroke-width="2"/>
<text x="1780.0" y="894.5" text-anchor="middle" class="bt">ड्राफ़्ट परचेज़ ऑर्डर</text>
<text x="1780.0" y="914.5" text-anchor="middle" class="bb">हर सप्लायर के लिए एक, स्टेटस</text>
<text x="1780.0" y="931.5" text-anchor="middle" class="bb">Draft, Zoho इन्वेंटरी में</text>
<text x="1780.0" y="948.5" text-anchor="middle" class="bb">इम्पोर्ट</text>
