<path d="M1622 748.0 H1654" fill="none" stroke="#14233c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<path d="M1730.0 306.0 V673 H1582 V682.0" fill="none" stroke="#14233c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="1736.0" y="654" class="al">निर्णय सेव</text>
<path d="M1840.0 306.0 V670 H1912 V830.0 H1780.0 V850.0" fill="none" stroke="#14233c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="1770" y="824.0" class="al">मंज़ूर मात्राएँ</text>
<text x="20" y="1040" class="ft"><tspan class="fb">चरण 2 (अगली तिमाही):</tspan> 3 साल के इतिहास से हर SKU की मौसमी चाल सीखना, सांख्यिकीय सेफ़्टी स्टॉक, बड़े डिस्ट्रीब्यूटर ऑर्डर घटाएँ तो रोज़ाना अलर्ट।</text>
<text x="20" y="1066" class="ft"><tspan class="fb">खरीद टीम से पुष्टि बाकी:</tspan> सप्लायर लीड टाइम (1 हफ़्ता माना गया), रास्ते में मौजूद ऑर्डर, जल्दी खराब होने वाले सामान की शेल्फ़ लाइफ़।</text>
</svg>
