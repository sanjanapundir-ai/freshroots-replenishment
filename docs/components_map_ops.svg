<text x="548" y="58" class="tt">Case 1 · Freshroots Operations — Components Map</text>
<text x="548" y="86" class="st">Mandate: live in 90 days, within ₹15 lakh, with 3 IT staff and 1 analyst. No AI team: SAP exports and written rules.</text>
<rect x="20.0" y="104" width="617.3333333333334" height="150" rx="10" fill="#fff8f2" stroke="#f3cdb0" stroke-width="1.5"/>
<rect x="20.0" y="104" width="6" height="150" rx="3" fill="#e8590c"/>
<text x="42.0" y="136" class="pn">1  Demand planning</text>
<text x="42.0" y="164" class="pc">₹28–34L a quarter in stockouts and write-offs</text>
<text x="42.0" y="196" class="pb">Bottleneck: monthly SAP-to-Excel cycle, data 3–4 weeks old</text>
<text x="42.0" y="226" class="pf">Fix: twice-weekly rules engine, review only exceptions</text>
<rect x="661.3333333333334" y="104" width="617.3333333333334" height="150" rx="10" fill="#fff8f2" stroke="#f3cdb0" stroke-width="1.5"/>
<rect x="661.3333333333334" y="104" width="6" height="150" rx="3" fill="#e8590c"/>
<text x="683.3333333333334" y="136" class="pn">2  Distributor service</text>
<text x="683.3333333333334" y="164" class="pc">₹18–25L a year for every distributor lost</text>
<text x="683.3333333333334" y="196" class="pb">Bottleneck: WhatsApp only, no data, after-hours queries wait</text>
<text x="683.3333333333334" y="226" class="pf">Fix: query log, 2-hour reply clock, handoff, auto-reply</text>
<rect x="1302.6666666666667" y="104" width="617.3333333333334" height="150" rx="10" fill="#fff8f2" stroke="#f3cdb0" stroke-width="1.5"/>
<rect x="1302.6666666666667" y="104" width="6" height="150" rx="3" fill="#e8590c"/>
<text x="1324.6666666666667" y="136" class="pn">3  Operations intelligence</text>
<text x="1324.6666666666667" y="164" class="pc">₹9L write-off from one late signal</text>
<text x="1324.6666666666667" y="196" class="pb">Bottleneck: weekly report, nobody owns a mid-week move</text>
<text x="1324.6666666666667" y="226" class="pf">Fix: one owner per metric, alerts with deadlines, escalation</text>
