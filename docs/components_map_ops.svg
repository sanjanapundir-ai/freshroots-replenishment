<text x="660.0" y="562.0" text-anchor="middle" class="bt">logs each query</text>
<text x="660.0" y="582.0" text-anchor="middle" class="bb">SKUs, stock, sales; query</text>
<text x="660.0" y="599.0" text-anchor="middle" class="bb">category</text>
<rect x="818" y="809.0" width="244" height="112" rx="10" fill="#e2f6e7" stroke="#2f9e44" stroke-width="2"/>
<text x="940.0" y="842.0" text-anchor="middle" class="bt">Data checks + signed-off</text>
<text x="940.0" y="862.0" text-anchor="middle" class="bt">rules</text>
<text x="940.0" y="882.0" text-anchor="middle" class="bb">Min/max cover, festival months,</text>
<text x="940.0" y="899.0" text-anchor="middle" class="bb">owner per metric</text>
<rect x="1098" y="809.0" width="244" height="112" rx="10" fill="#fff1cc" stroke="#e8a400" stroke-width="2"/>
<text x="1220.0" y="859.0" text-anchor="middle" class="bt">Cover per SKU, reply</text>
<text x="1220.0" y="879.0" text-anchor="middle" class="bt">clock, order-drop check</text>
<rect x="1378" y="809.0" width="244" height="112" rx="10" fill="#ffe3ef" stroke="#d6336c" stroke-width="2"/>
<text x="1500.0" y="850.5" text-anchor="middle" class="bt">Flags exceptions, routes</text>
<text x="1500.0" y="870.5" text-anchor="middle" class="bt">each to one owner</text>
<text x="1500.0" y="890.5" text-anchor="middle" class="bb">Rules, no LLM</text>
<rect x="1378" y="959.0" width="244" height="112" rx="10" fill="#dff5f2" stroke="#0c8f80" stroke-width="2"/>
<text x="1500.0" y="1009.0" text-anchor="middle" class="bt">Runs, decisions,</text>
<text x="1500.0" y="1029.0" text-anchor="middle" class="bt">queries, alerts</text>
<rect x="1658" y="509.0" width="244" height="112" rx="10" fill="#ffe8d9" stroke="#e8590c" stroke-width="2"/>
<text x="1780.0" y="552.0" text-anchor="middle" class="bt">Owner acts by deadline</text>
<text x="1780.0" y="572.0" text-anchor="middle" class="bb">Approve order, reply,</text>
<text x="1780.0" y="589.0" text-anchor="middle" class="bb">acknowledge alert</text>
<rect x="1658" y="359.0" width="244" height="112" rx="10" fill="#fde2e2" stroke="#c92a2a" stroke-width="2"/>
<text x="1780.0" y="392.0" text-anchor="middle" class="bt">Dashboard: needs action</text>
<text x="1780.0" y="412.0" text-anchor="middle" class="bt">today</text>
<text x="1780.0" y="432.0" text-anchor="middle" class="bb">Escalations, problem → fix,</text>
<text x="1780.0" y="449.0" text-anchor="middle" class="bb">Hindi / English</text>
