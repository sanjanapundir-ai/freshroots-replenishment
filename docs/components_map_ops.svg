<text x="380.0" y="729.0" text-anchor="middle" class="bt">WhatsApp query arrives</text>
<rect x="538" y="509.0" width="244" height="112" rx="10" fill="#e3efff" stroke="#2f6fd6" stroke-width="2"/>
